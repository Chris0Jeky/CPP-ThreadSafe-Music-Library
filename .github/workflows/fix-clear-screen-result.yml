name: Apply clear-screen result fix

on:
  push:
    branches:
      - fix/remove-phantom-examples

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v3
        with:
          ref: fix/remove-phantom-examples
      - name: Handle the screen-clear command result
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.cpp')
          text = path.read_text()
          old = '''    void clear_screen() {
                  #ifdef _WIN32
                      std::system("cls");
                  #else
                      std::system("clear");
                  #endif
              }'''
          new = '''    void clear_screen() {
                  #ifdef _WIN32
                      const int result = std::system("cls");
                  #else
                      const int result = std::system("clear");
                  #endif
                  if (result == -1) {
                      std::cerr << "Warning: the screen clear command could not be started.\\n";
                  }
              }'''
          if text.count(old) != 1:
              raise SystemExit('clear_screen replacement marker not found exactly once')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify and publish the focused correction
        run: |
          grep -F 'const int result = std::system("clear");' src/main.cpp
          grep -F 'if (result == -1)' src/main.cpp
          git diff --check
          rm .github/workflows/fix-clear-screen-result.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.cpp .github/workflows/fix-clear-screen-result.yml
          git commit -m "fix: handle screen clear command result"
          git push
